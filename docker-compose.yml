name: dake

# 镜像来自 Docker Hub；如自建镜像仓库，改 .env 的 DOCKER_NAMESPACE/IMAGE_TAG
services:
  app:
    image: ${DOCKER_NAMESPACE:-dake}/dake-app:${IMAGE_TAG:-3.5.1}
    restart: always
    hostname: dake-app
    ports:
      # 后端 API 端口（两个前端容器代理到它；宿主端口仅调试用，可注释）
      - "${APP_PORT:-10025}:10025"
    environment:
      JAVA_OPTS: -XX:+UseG1GC -Xms256m -Xmx1g -Duser.timezone=Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "10025"
      # ---- 数据库 ----
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-dake}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      # ---- Redis ----
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      # ---- MinIO 对象存储 ----
      ATTACH_DEFAULT_STORAGE_TYPE: "2"
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: dake
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
      # 浏览器访问 MinIO 的地址（题目/附件图片 URL 基址），由 .env 的 PUBLIC_HOST 派生
      MINIO_ACCESS_DOMAIN: http://${PUBLIC_HOST:-localhost}:${MINIO_PORT:-9000}
      MINIO_CHUNK_SIZE_MB: "10"
      # ---- Judge0 代码判题 ----
      JUDGE0_URL: http://judge0:2358
      JUDGE0_ENABLED: ${JUDGE0_ENABLED:-true}
      # ---- 跨域 / 回调信任（由 PUBLIC_HOST + 前端端口派生）----
      AIMARK_TRUSTED_BASE_URL: http://${PUBLIC_HOST:-localhost}:${TEACHER_WEB_PORT:-10026}
      CORS_ALLOWED_ORIGINS: http://${PUBLIC_HOST:-localhost}:${TEACHER_WEB_PORT:-10026},http://${PUBLIC_HOST:-localhost}:${STUDENT_WEB_PORT:-10027}
      TOKEN_SIGN_KEY: ${TOKEN_SIGN_KEY:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./profile/logs/:/home/profile/logs/
      - ./profile/file/:/home/profile/file/
      - ./profile/tmp/:/home/profile/tmp/
      - ./profile/sub_file:/home/profile/subject/file/
      - ./profile/img_file/img:/home/profile/img/
      - ./profile/templates/:/home/profile/templates/
      - ./profile/scorePdf/:/home/profile/scorePdf/
      - ./profile/fonts/:/home/profile/fonts/
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dake

  teacher-web:
    image: ${DOCKER_NAMESPACE:-dake}/dake-teacher-web:${IMAGE_TAG:-3.5.1}
    restart: always
    hostname: dake-teacher-web
    ports:
      - "${TEACHER_WEB_PORT:-10026}:10026"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./nginx/dk-admin/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/dk-admin/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - dake

  student-web:
    image: ${DOCKER_NAMESPACE:-dake}/dake-student-web:${IMAGE_TAG:-3.5.1}
    restart: always
    hostname: dake-student-web
    ports:
      - "${STUDENT_WEB_PORT:-10027}:10027"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./nginx/dk-web/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/dk-web/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - dake

  postgresql:
    image: postgres:16
    restart: always
    environment:
      TZ: Asia/Shanghai
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-dake}
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
    # 如需从宿主机直连数据库，取消注释（默认仅容器网络内可达）
    # ports:
    #   - "${DB_PORT_MAP:-127.0.0.1:15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-dake}"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      - dake

  redis:
    image: redis:7
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      - dake

  minio:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio/data:/data
    command: server --console-address ':9001' /data
    privileged: true
    ports:
      # 浏览器需要直接访问 MinIO 拉取题目图片，必须映射到宿主
      - "${MINIO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - dake

  # ==================== Judge0 在线判题（可选，--profile judging）====================
  # 首次启用前须确认宿主机为 cgroup v1（见 README「Judge0 判题准备」），否则代码题判分会失败。

  judge0:
    image: judge0/judge0:1.13.1
    restart: always
    profiles: [judging]
    privileged: true
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    environment:
      # 与主库共用 postgresql 实例（judge0 自动建 judge0 库）；密码覆盖 judge0.conf 默认值
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?请在 .env 中设置 JUDGE0_REDIS_PASSWORD}
    depends_on:
      postgresql:
        condition: service_healthy
      judge0-redis:
        condition: service_started
    networks:
      - dake

  judge0-worker:
    image: judge0/judge0:1.13.1
    restart: always
    profiles: [judging]
    privileged: true
    command: ["./scripts/workers"]
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?请在 .env 中设置 JUDGE0_REDIS_PASSWORD}
    depends_on:
      postgresql:
        condition: service_healthy
      judge0-redis:
        condition: service_started
    networks:
      - dake

  judge0-redis:
    image: redis:7
    restart: always
    profiles: [judging]
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?请在 .env 中设置 JUDGE0_REDIS_PASSWORD}
    networks:
      - dake

networks:
  dake:
